<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crime Data Management</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-image:linear-gradient(rgba(63, 61, 61, 0.17), rgba(42, 41, 41, 0.5)), url('static/image1.jpg'); 
            background-repeat: no-repeat;
            background-position: center center;
            background-attachment: fixed;
            background-size: cover;
           /* background-color:grey;*/
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            flex-direction: column;
        }
        

        h1 {
            text-align: center;
            font-size: 36px;
            color:rgb(22, 21, 21);
            text-shadow: 1px 1px 1px rgb(0, 0, 0);
        }

        h2 {
            text-align: center;
            font-size: 24px;
            margin-bottom: 20px;
            color:rgba(53, 50, 50, 0.9);
            text-shadow: 1px 1px 1px rgba(0, 0, 0, 0.9);
        }

        form {
            background-color: rgba(255, 255, 255, 0.85);
            border-radius: 8px;
            padding: 20px;
            margin: 20px auto;
            max-width: 400px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.2);
        }

        form h3 {
            text-align: center;
            font-size: 20px;
            color:rgba(33, 35, 34, 0.85);
        }

        input[type="file"] {
            display: block;
            margin: 10px auto;
            padding: 10px;
            width: 100%;
            box-sizing: border-box;
            border: 2px solid #ccc;
            border-radius: 5px;
        
        }

        button {
            display: block;
            width: 100%;
            padding: 10px;
            background-color:rgb(236, 53, 53);
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        button:hover {
            background-color: #1abc9c;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
            text-align: center;
        }

        .form-container {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            width: 100%;
        }

        .form-container form {
            margin: 10px;
        }

        @media (max-width: 768px) {
            .form-container {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Welcome to Crime Data Management</h1>
        <h2>Select an Option</h2>
        <div class="form-container">
            <form action="/initial-upload" method="post" enctype="multipart/form-data">
                <h3>Initial Upload</h3>
                <input type="file" name="file" required>
                <button type="submit">Upload</button>
            </form>

            <form action="/update-upload" method="post" enctype="multipart/form-data">
                <h3>Update Upload</h3>
                <input type="file" name="file" required>
                <button type="submit">Upload</button>
            </form>
        </div>
    </div>
</body>
</html>
